<style>
:root{--bg:#f6f4ec;--grid:rgba(31,111,92,.08);--card:#fff;--ink:#17261f;--mute:#5d6b64;--line:#dcd8c9;--hero:#0f3d33;--chalk:#f4f1e6;--accent:#f2b134;--main:#1f6f5c;--soft:#e9f2ee;--paper:#fffaf0;--coral:#d9573b;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--grid:rgba(79,191,159,.07);--card:#18231f;--ink:#e8efe9;--mute:#9cb0a7;--line:#2b3a34;--hero:#0a2a23;--main:#4fbf9f;--soft:#1f302a;--paper:#1d2a24;--coral:#ff8a6b}}
:root[data-theme="dark"]{--bg:#0f1714;--grid:rgba(79,191,159,.07);--card:#18231f;--ink:#e8efe9;--mute:#9cb0a7;--line:#2b3a34;--hero:#0a2a23;--main:#4fbf9f;--soft:#1f302a;--paper:#1d2a24;--coral:#ff8a6b}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"DM Sans",system-ui,"Segoe UI",Arial,sans-serif;line-height:1.65;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:820px;margin:0 auto;padding:0 18px}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;margin:0;line-height:1.2}
header{background:var(--hero);color:var(--chalk);border-radius:0 0 28px 28px;padding:18px 0 34px}
header a{color:var(--accent);text-decoration:none;font-weight:700;font-size:.92rem}
header h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:18px 0 8px}
header p{margin:0;max-width:56ch;color:rgba(244,241,230,.85)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}
.tab{font:inherit;font-weight:700;font-size:.92rem;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--main);border-color:var(--main);color:#fff}
.tab.done::after{content:" ✓"}
.tab:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.sec h3{font-size:1.1rem;margin-bottom:8px}
.lbl{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);margin-bottom:4px}
.baca{background:var(--paper);border-left:6px solid var(--accent)}
.baca p{margin:0 0 10px}.baca p:last-child{margin:0}
.konsep{background:var(--soft)}
ul,ol{margin:0;padding-left:22px}li{margin-bottom:6px}
.mat{font-family:"Cambria Math",Cambria,Georgia,serif;font-weight:700}
.contoh{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.contoh:first-of-type{border-top:0;margin-top:0;padding-top:0}
.btn{font:inherit;font-weight:700;background:var(--main);color:#fff;border:0;border-radius:12px;padding:11px 18px;cursor:pointer}
.btn.alt{background:transparent;color:var(--main);border:1.5px solid var(--main)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 50px}
textarea{width:100%;min-height:64px;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
</style>

<body>
<header><div class="wrap">
  <a href="index.html">&larr; Kembali ke beranda</a>
  <h1>Aljabar</h1>
  <p>Materi Matematika Kelas 7 &middot; 6 pertemuan. Setiap pertemuan dimulai dari bacaan, lalu konsep, contoh, dan latihan. Bacalah dengan teliti sebelum menghitung.</p>
</div></header>

<main class="wrap">
  <div class="tabs" id="tabs" role="tablist" aria-label="Pertemuan"></div>
  <div id="isi"></div>
  <div class="nav"><button class="btn alt" id="prev" type="button">&larr; Sebelumnya</button><button class="btn" id="done" type="button">Tandai selesai</button><button class="btn alt" id="next" type="button">Berikutnya &rarr;</button></div>
</main>

<script>
var P = [
{ t:"Unsur-unsur Bentuk Aljabar",
  tujuan:"Mengenali variabel, koefisien, konstanta, suku, dan suku sejenis, lalu menuliskan situasi sebagai bentuk aljabar.",
  bacaTitle:"Es Teh Bu Sari",
  baca:["Bu Sari berjualan di kantin sekolah. Harga satu gelas es teh sering berubah, jadi ia menyebut harga itu <b>t</b> rupiah. Hari ini terjual 5 gelas, sehingga penjualan es tehnya ditulis <span class='mat'>5t</span>.","Setiap hari Bu Sari juga harus membayar uang kebersihan tetap sebesar Rp3.000. Pendapatan bersih hari itu ditulis <span class='mat'>5t − 3.000</span>. Bu Sari memakai huruf karena harga es teh belum pasti, tetapi cara menghitungnya tetap sama."],
  konsep:["<b>Variabel</b>: huruf pengganti bilangan yang nilainya belum tetap (contoh: t).","<b>Koefisien</b>: bilangan yang menempel di depan variabel (pada 5t, koefisiennya 5).","<b>Konstanta</b>: suku yang berupa bilangan saja (pada 5t − 3.000, konstantanya −3.000).","<b>Suku</b>: bagian bentuk aljabar yang dipisahkan tanda + atau −.","<b>Suku sejenis</b>: suku dengan variabel yang sama (4x dan −2x)."],
  contoh:[["Bentuk <span class='mat'>4x + 7y − 2x + 9</span>: sebutkan suku, koefisien x, konstanta, dan suku sejenis.","Suku: 4x, 7y, −2x, 9. Koefisien x ada dua: 4 dan −2. Konstanta: 9. Suku sejenis: 4x dan −2x."]],
  latihan:["Berdasarkan bacaan, mengapa Bu Sari memakai huruf t, bukan langsung menulis harga es teh? Jelaskan dengan kalimatmu sendiri.","Pada bentuk <span class='mat'>6a − 4b + 5</span>, sebutkan koefisien a, koefisien b, dan konstanta.","Harga 1 buku adalah b rupiah. Dina membeli 4 buku dan 1 pensil seharga Rp2.500. Tulis bentuk aljabar total belanja Dina, lalu sebutkan variabel dan konstantanya."],
  refleksi:"Kapan dalam kehidupan sehari-hari kamu memakai 'sesuatu yang belum diketahui' seperti variabel?" },

{ t:"Sifat-sifat Operasi pada Aljabar",
  tujuan:"Memahami sifat komutatif, asosiatif, dan distributif, serta menggunakannya untuk menjelaskan mengapa suatu hasil benar.",
  bacaTitle:"Belanja Perlengkapan Kelas",
  baca:["Raka menghitung belanja perlengkapan kelas. Ia membeli sebuah penghapus seharga x rupiah dan sebuah pensil seharga y rupiah. Kasir menulis <span class='mat'>x + y</span>, sedangkan Raka menulis <span class='mat'>y + x</span>. Total uangnya ternyata sama.","Lalu Rani membeli 3 paket. Setiap paket berisi 1 pena seharga p rupiah dan 1 buku seharga Rp4.000. Rani menghitung <span class='mat'>3(p + 4.000)</span>, sedangkan temannya menghitung <span class='mat'>3p + 12.000</span>. Keduanya benar."],
  konsep:["<b>Komutatif</b>: urutan boleh ditukar pada penjumlahan dan perkalian. <span class='mat'>a + b = b + a</span>, <span class='mat'>a × b = b × a</span>.","<b>Asosiatif</b>: pengelompokan boleh diubah. <span class='mat'>(a + b) + c = a + (b + c)</span>.","<b>Distributif</b>: <span class='mat'>a(b + c) = ab + ac</span>.","Pengurangan dan pembagian <b>tidak</b> bersifat komutatif."],
  contoh:[["Mengapa <span class='mat'>3(p + 4.000) = 3p + 12.000</span>?","Tiga paket masing-masing berisi p dan 4.000, jadi ada 3 pena (3p) dan 3 buku (3 × 4.000 = 12.000). Itulah sifat distributif."]],
  latihan:["Dari bacaan, mengapa Raka dan kasir mendapat total yang sama walaupun urutan penulisannya berbeda? Sebutkan sifat yang dipakai.","Benar atau salah: <span class='mat'>x − y = y − x</span>. Beri contoh bilangan untuk membuktikan jawabanmu.","Jabarkan <span class='mat'>4(2y + 5)</span>. Lalu buat cerita pendek yang cocok dengan bentuk tersebut."],
  refleksi:"Mana yang lebih mudah bagimu saat menghitung, 3(p + 4.000) atau 3p + 12.000? Mengapa?" },

{ t:"Penjumlahan dan Pengurangan Bentuk Aljabar",
  tujuan:"Menjumlahkan dan mengurangkan bentuk aljabar dengan menggabungkan suku-suku sejenis.",
  bacaTitle:"Panen Pak Anton",
  baca:["Pak Anton memanen jeruk dan apel. Hari Senin ia memperoleh <span class='mat'>3j + 2a</span> kilogram (j untuk jeruk, a untuk apel). Hari Selasa hasilnya <span class='mat'>5j + 4a</span> kilogram.","Pak Anton tidak menjumlahkan jeruk dengan apel, sebab keduanya buah yang berbeda. Ia menggabungkan jeruk dengan jeruk, apel dengan apel. Total dua hari: <span class='mat'>8j + 6a</span>. Hari Rabu ia menjual <span class='mat'>2j + a</span>, sehingga sisanya <span class='mat'>6j + 5a</span>."],
  konsep:["Hanya <b>suku sejenis</b> yang dapat dijumlahkan atau dikurangkan: koefisiennya dioperasikan, variabelnya tetap.","Saat mengurangkan sebuah kurung, ubah tanda semua suku di dalamnya: <span class='mat'>−(3p − 2) = −3p + 2</span>."],
  contoh:[["Hitung <span class='mat'>(7x − 3y + 4) + (2x + 5y − 9)</span>.","x: 7 + 2 = 9x. y: −3 + 5 = 2y. Konstanta: 4 − 9 = −5. Hasil: <span class='mat'>9x + 2y − 5</span>."],["Hitung <span class='mat'>(8p + 3) − (3p − 2)</span>.","8p − 3p = 5p, dan 3 − (−2) = 5. Hasil: <span class='mat'>5p + 5</span>."]],
  latihan:["Dari bacaan, mengapa Pak Anton tidak boleh menulis hasil panen dua hari sebagai 14 saja? Jelaskan.","Hitung <span class='mat'>(5a + 2b) + (3a − 6b)</span>.","Hitung <span class='mat'>(9m − 4) − (2m + 6)</span>. Jelaskan apa yang terjadi pada tanda −4 dan +6 saat dikurangkan."],
  refleksi:"Kesalahan apa yang paling mungkin terjadi saat mengurangkan bentuk aljabar? Bagaimana cara menghindarinya?" },

{ t:"Perkalian dan Pembagian Bentuk Aljabar",
  tujuan:"Mengalikan bilangan dengan bentuk aljabar dan membagi bentuk aljabar dengan bilangan.",
  bacaTitle:"Paket Alat Tulis Koperasi",
  baca:["Koperasi sekolah membuat paket alat tulis. Setiap paket berisi 2 buku, harga satu buku b rupiah, dan 1 penggaris seharga Rp3.000. Biaya satu paket adalah <span class='mat'>2b + 3.000</span>.","Sebuah kelas memesan 6 paket, jadi biayanya <span class='mat'>6(2b + 3.000)</span>. Koperasi menjabarkannya menjadi <span class='mat'>12b + 18.000</span>. Setelah itu, sebuah kelas lain membagi sama rata biaya <span class='mat'>12k + 8</span> kepada 4 orang, sehingga tiap orang membayar <span class='mat'>3k + 2</span>."],
  konsep:["Perkalian: kalikan bilangan itu dengan <b>setiap suku</b> di dalam kurung. <span class='mat'>k(ax + b) = kax + kb</span>.","Perkalian variabel: <span class='mat'>2x × 3x = 6x²</span>.","Pembagian: bagi <b>setiap suku</b> dengan bilangan yang sama. <span class='mat'>(12k + 8) ÷ 4 = 3k + 2</span>.","Hati-hati dengan tanda: <span class='mat'>(−2)(3x − 5) = −6x + 10</span>."],
  contoh:[["Jabarkan <span class='mat'>(−2)(3x − 5)</span>.","−2 × 3x = −6x dan −2 × (−5) = +10. Hasil: <span class='mat'>−6x + 10</span>."]],
  latihan:["Dari bacaan, apa arti 12b dan 18.000 pada hasil 12b + 18.000 dalam konteks paket alat tulis?","Jabarkan <span class='mat'>5(2a − 3)</span> dan <span class='mat'>(−4)(x + 6)</span>.","Sederhanakan <span class='mat'>(18y − 12) ÷ 6</span>, lalu buat soal ceritanya."],
  refleksi:"Mengapa kita harus mengalikan atau membagi SEMUA suku di dalam kurung, bukan hanya suku pertama?" },

{ t:"Menyederhanakan dan Menghitung Nilai Bentuk Aljabar",
  tujuan:"Menyederhanakan bentuk aljabar dan mensubstitusi nilai variabel untuk memperoleh hasilnya.",
  bacaTitle:"Tarif Ojek Online",
  baca:["Sebuah aplikasi ojek online menghitung tarif dengan aturan: biaya tetap Rp6.000 ditambah Rp2.500 untuk setiap kilometer. Jika jarak tempuh k kilometer, tarifnya ditulis <span class='mat'>6.000 + 2.500k</span>.","Untuk jarak 4 km, ganti k dengan 4: 6.000 + 2.500 × 4 = 16.000. Jadi tarifnya Rp16.000. Mengganti variabel dengan bilangan disebut <b>substitusi</b>."],
  konsep:["<b>Menyederhanakan</b>: gabungkan suku sejenis sampai tidak ada yang bisa digabung lagi.","<b>Substitusi</b>: ganti variabel dengan nilainya, lalu hitung sesuai urutan operasi.","Beri tanda kurung saat mengganti dengan bilangan negatif."],
  contoh:[["Sederhanakan <span class='mat'>5x + 3y − 2x + 4y</span>.","x: 5 − 2 = 3x. y: 3 + 4 = 7y. Hasil: <span class='mat'>3x + 7y</span>."],["Hitung nilai <span class='mat'>3x − 5</span> untuk x = 4.","3(4) − 5 = 12 − 5 = 7."]],
  latihan:["Dari bacaan, jika jarak tempuh 9 km, berapa tarif ojek? Tuliskan langkah substitusinya.","Sederhanakan <span class='mat'>7a − 2b + 3a + 5b</span>.","Hitung nilai <span class='mat'>4p − 7</span> untuk p = −2. Mengapa -2 perlu diberi kurung saat disubstitusi?"],
  refleksi:"Sebutkan satu situasi lain yang rumusnya mirip tarif ojek (ada biaya tetap dan biaya per satuan)." },

{ t:"Penerapan dalam Masalah Kontekstual",
  tujuan:"Menerapkan bentuk aljabar dan operasinya untuk memodelkan dan mengambil keputusan dalam masalah nyata.",
  bacaTitle:"Darmawisata dan Paket Data",
  baca:["<b>Kasus 1.</b> Kelas 7 akan darmawisata. Tiket anak a rupiah, sedangkan tiket dewasa lebih mahal Rp5.000 dari tiket anak. Rombongan terdiri dari 4 anak dan 2 dewasa, sehingga total tiket ditulis <span class='mat'>4a + 2(a + 5.000)</span>, yang dapat disederhanakan menjadi <span class='mat'>6a + 10.000</span>.","<b>Kasus 2.</b> Dua paket data ditawarkan. Paket A: biaya tetap Rp20.000 ditambah Rp5.000 per GB. Paket B: tanpa biaya tetap, Rp8.000 per GB. Untuk x GB, paket A dituliskan <span class='mat'>20.000 + 5.000x</span> dan paket B <span class='mat'>8.000x</span>."],
  konsep:["Langkah menyelesaikan masalah kontekstual: (1) baca dan tandai yang diketahui, (2) tentukan variabel, (3) tulis bentuk aljabar, (4) sederhanakan atau substitusi, (5) tafsirkan hasil kembali ke konteks, bukan hanya angka."],
  contoh:[["Kasus 1: jika tiket anak Rp15.000, berapa total tiket rombongan?","6a + 10.000 dengan a = 15.000: 6 × 15.000 + 10.000 = 100.000. Total tiket Rp100.000."]],
  latihan:["Kasus 2: hitung biaya paket A dan paket B untuk 5 GB. Paket mana yang lebih murah?","Kasus 2: ulangi untuk 8 GB. Apakah paket yang lebih murah tetap sama? Berikan saran kepada seseorang yang memakai sekitar 8 GB per bulan, lengkap dengan alasan.","Buat satu masalah kontekstual dari kehidupanmu (misalnya biaya tetap + biaya per satuan), tuliskan bentuk aljabarnya, lalu selesaikan untuk satu nilai variabel."],
  refleksi:"Apa bedanya menjawab 'hasilnya 100.000' dengan menjawab 'total tiket rombongan Rp100.000'? Mengapa kalimat jawaban itu penting?" }
];

var $ = function(i){ return document.getElementById(i); };
var cur = 0, KEY = "aljabar7:selesai";
function sim(a){ try{ return JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(e){ return []; } }
function simpan(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }

function tabs(){
  var d = sim(), h = "";
  P.forEach(function(p, i){
    h += '<button class="tab' + (d.indexOf(i) >= 0 ? " done" : "") + '" role="tab" aria-selected="' + (i === cur) + '" onclick="buka(' + i + ')">Pertemuan ' + (i + 1) + '</button>';
  });
  $("tabs").innerHTML = h;
}
function buka(i){
  cur = i; var p = P[i], h = "";
  h += '<div class="sec"><div class="lbl">Pertemuan ' + (i + 1) + '</div><h2>' + p.t + '</h2><p style="margin:8px 0 0;color:var(--mute)"><b>Tujuan:</b> ' + p.tujuan + '</p></div>';
  h += '<div class="sec baca"><div class="lbl">Baca dulu &middot; ' + p.bacaTitle + '</div>' + p.baca.map(function(t){ return '<p>' + t + '</p>'; }).join("") + '</div>';
  h += '<div class="sec konsep"><h3>Konsep yang perlu dipahami</h3><ul>' + p.konsep.map(function(t){ return '<li>' + t + '</li>'; }).join("") + '</ul></div>';
  h += '<div class="sec"><h3>Contoh</h3>' + p.contoh.map(function(c){ return '<div class="contoh"><p style="margin:0 0 4px"><b>' + c[0] + '</b></p><p style="margin:0;color:var(--mute)">' + c[1] + '</p></div>'; }).join("") + '</div>';
  h += '<div class="sec"><h3>Latihan literasi dan hitung</h3><ol>' + p.latihan.map(function(t){ return '<li>' + t + '<textarea aria-label="Jawaban"></textarea></li>'; }).join("") + '</ol><p style="margin:10px 0 0;color:var(--mute);font-size:.88rem">Jawaban di kotak ini tidak tersimpan. Tulis juga di bukumu atau kumpulkan sesuai arahan guru.</p></div>';
  h += '<div class="sec"><div class="lbl">Refleksi</div><p style="margin:0">' + p.refleksi + '</p></div>';
  var lk = {1:1, 3:2, 5:3};
  h += '<div class="sec"><h3>Lanjut berlatih</h3><p style="margin:0 0 8px"><a href="latihan-aljabar-7.html#p' + (i + 1) + '">Latihan interaktif Pertemuan ' + (i + 1) + '</a> (5 soal, koreksi langsung)</p>' + (lk[i] ? '<p style="margin:0"><a href="lkpd-aljabar-7.html#l' + lk[i] + '">LKPD ' + lk[i] + ' untuk dikerjakan berkelompok</a></p>' : '') + (i === 0 ? '<p style="margin:8px 0 0"><a href="tugas-aljabar-7-p1.html">Tugas Pertemuan 1: unsur-unsur bentuk aljabar</a></p>' : '') + (i === 2 ? '<p style="margin:8px 0 0"><a href="game-suku-sejenis-7.html">Game: Jembatan Suku Sejenis</a> (pemanasan sebelum atau penguatan sesudah materi ini)</p><p style="margin:8px 0 0"><a href="tugas-aljabar-7-p3.html">Tugas Pertemuan 3: penjumlahan dan pengurangan bentuk aljabar</a></p>' : '') + '</div>';
  $("isi").innerHTML = h; tabs();
  $("prev").style.visibility = i ? "visible" : "hidden"; $("next").style.visibility = i < P.length - 1 ? "visible" : "hidden";
  $("done").textContent = sim().indexOf(i) >= 0 ? "Batalkan tanda selesai" : "Tandai selesai";
  history.replaceState(null, "", "#p" + (i + 1)); window.scrollTo({ top: 0 });
}
$("prev").onclick = function(){ buka(cur - 1); };
$("next").onclick = function(){ buka(cur + 1); };
$("done").onclick = function(){ var d = sim(), k = d.indexOf(cur); if (k >= 0) d.splice(k, 1); else d.push(cur); simpan(d); buka(cur); };
var m = /^#p([1-6])$/.exec(location.hash); buka(m ? +m[1] - 1 : 0);
</script>
</body>
</html>
