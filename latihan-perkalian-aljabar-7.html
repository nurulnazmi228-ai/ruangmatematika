  var r=ekspr(); if(!r||i<s.length) return null;
  for(var k in r) if(Math.abs(r[k])<1e-9) delete r[k];
  return r;
}
function samaM(a,b){var ka=Object.keys(a),kb=Object.keys(b);return ka.length===kb.length&&ka.every(function(k){return b.hasOwnProperty(k)&&Math.abs(a[k]-b[k])<1e-9})}
function akhir(v){var p=String(v).split("=").map(function(x){return x.trim()}).filter(Boolean);return p.length?p[p.length-1]:""}
function sederhana(v){
  var s=bersih(akhir(v)),w=/^\(([^()]*)\)$/.exec(s); if(w) s=w[1];
  if(/[()*\/]/.test(s)) return false;
  var ts=s.match(/[+-]?[^+-]+/g)||[],seen={};
  for(var i=0;i<ts.length;i++){var key=ts[i].replace(/^[+-]?[\d.]*/,"").split("").sort().join("");if(seen[key])return false;seen[key]=1}
  return true;
}
function valid(v){return !!pBaca(akhir(v))}
function cekIsi(v,a){var x=pBaca(akhir(v)),y=pBaca(a);return {nilai:!!x&&!!y&&samaM(x,y),sederhana:sederhana(v)}}
/* ---------- penyimpanan ---------- */
function kid(){return ID.nama.toLowerCase().replace(/\s+/g," ")+"|"+ID.kelas}
function get(k){try{return JSON.parse(localStorage.getItem(SK+k+":"+kid())||"null")}catch(e){return null}}
function put(k,v){try{localStorage.setItem(SK+k+":"+kid(),JSON.stringify(v))}catch(e){}}
function lamaTxt(d){var m=Math.floor(d/60),s=d%60;return (m?m+" menit ":"")+s+" detik"}
function bintangMisi(b,n){return b===n?3:b/n>=0.66?2:b/n>=0.33?1:0}
function bTxt(n){return n?"⭐".repeat(n)+"☆".repeat(3-n):"☆☆☆"}
/* ---------- tampilan ---------- */
function riwayat(){
  if(!H.length) return "";
  return '<div class="sec"><div class="lbl">Riwayat pengerjaan</div><div class="scroll"><table><tr><th>Ke-</th><th>Waktu kirim</th><th>Nilai</th><th>Bintang</th><th>Lama</th></tr>'+H.map(function(h){return '<tr><td>'+h.n+'</td><td>'+esc(h.waktu)+'</td><td><b>'+h.nilai+'</b></td><td>'+h.bintang+'/'+(h.maxB||12)+'</td><td>'+lamaTxt(h.lama)+'</td></tr>'}).join("")+'</table></div></div>';
}
function jalur(){
  var h="";for(var i=0;i<S.length;i++){var st=DONE[i]?"sel":(i===0||DONE[i-1])?"on":"";h+=(i?'<div class="gr'+(DONE[i-1]?" sel":"")+'"></div>':"")+'<div class="nd '+st+'">'+(DONE[i]?"✓":(i===0||DONE[i-1])?(i+1):"🔒")+'</div>'}
  var b=DONE.reduce(function(s,d){return s+(d?d.bintang:0)},0),k=DONE.filter(Boolean).length;
  $("top").innerHTML='<div class="sec"><span class="ke">Pengerjaan ke-'+N+'</span><div class="jalur">'+h+'</div><div class="bar"><i style="width:'+Math.round(k*100/S.length)+'%"></i></div><div class="hint" style="margin-top:6px">Misi selesai: '+k+' dari '+S.length+' &middot; Bintang: '+b+' dari '+(S.length*3)+'</div></div>';
}
function render(){
  $("riw").innerHTML=riwayat();$("hasil").innerHTML="";
  var d=get("d:"+N)||{};DONE=get("m:"+N)||[];
  var h="";
  S.forEach(function(ms,mi){
    h+='<section class="misi" id="ms'+mi+'" style="--mc:'+MISI[mi].c+'"><div class="mh"><div class="no">'+(mi+1)+'</div><div><h3>Misi '+(mi+1)+': '+MISI[mi].n+'</h3><div class="hint">'+ms.length+' soal</div></div><span class="bt" id="bt'+mi+'"></span></div><div class="mb" id="mb'+mi+'"></div></section>';
  });
  $("misi").innerHTML=h;
  if(!get("t0:"+N)) put("t0:"+N,Date.now()); T0=get("t0:"+N);
  S.forEach(function(ms,mi){isiMisi(mi,d)});
  S.forEach(function(ms,mi){if(DONE[mi])periksa(mi,true)});
  jalur();segarkan();
}
function terbuka(mi){return mi===0||!!DONE[mi-1]}
function isiMisi(mi,d){
  var ms=S[mi],h='<div class="kunci"><b>Jurus:</b> '+MISI[mi].j+'</div>';
  ms.forEach(function(s,si){var id=mi+"-"+si;
    h+='<div class="q"><div class="n">Soal '+(si+1)+'</div><p>'+s.q+'</p>';
    if(s.tipe==="pg")h+=s.opts.map(function(o,oi){return '<label class="opt" id="o'+id+'-'+oi+'"><input type="radio" name="r'+id+'" value="'+oi+'" data-k="'+id+'"> '+"ABC"[oi]+". "+esc(o.t)+'</label>'}).join("");
    else h+='<input type="text" id="t'+id+'" data-k="'+id+'" autocomplete="off" aria-label="Jawaban soal '+(si+1)+'" placeholder="Tulis jawabanmu">';
    h+='<div id="f'+id+'"></div></div>';
  });
  h+='<p style="margin:14px 0 0"><button class="btn" id="pm'+mi+'" type="button" onclick="periksa('+mi+')">Periksa Misi '+(mi+1)+'</button></p><div class="pesan" id="ps'+mi+'"></div><div id="mf'+mi+'"></div>';
  $("mb"+mi).innerHTML=h;
  ms.forEach(function(s,si){var id=mi+"-"+si,v=d[id];
    if(s.tipe==="pg"){if(v!==undefined&&v!==null){var r=document.querySelector('input[name="r'+id+'"][value="'+v+'"]');if(r)r.checked=true}}
    else if(v)$("t"+id).value=v;
  });
  document.querySelectorAll("#mb"+mi+" [data-k]").forEach(function(e){e.onchange=e.oninput=simpanDraf});
}
function simpanDraf(){var o=get("d:"+N)||{};S.forEach(function(ms,mi){ms.forEach(function(s,si){var id=mi+"-"+si;if(s.tipe==="pg"){var r=document.querySelector('input[name="r'+id+'"]:checked');if(r)o[id]=+r.value}else{var e=$("t"+id);if(e)o[id]=e.value}})});put("d:"+N,o)}
function segarkan(){
  S.forEach(function(ms,mi){var buka=terbuka(mi),mb=$("mb"+mi);
    if(!buka){mb.innerHTML='<div class="kunc">🔒 Selesaikan Misi '+mi+' dulu untuk membuka misi ini.</div>';mb.dataset.lock="1"}
    else if(mb.dataset.lock){delete mb.dataset.lock;isiMisi(mi,get("d:"+N)||{})}
    $("bt"+mi).textContent=DONE[mi]?bTxt(DONE[mi].bintang):"";
  });
}
function periksa(mi,diam){
  var ms=S[mi],kosong=0,aneh=0,jaw=[];
  ms.forEach(function(s,si){var id=mi+"-"+si;
    if(s.tipe==="pg"){var r=document.querySelector('input[name="r'+id+'"]:checked');if(!r)kosong++;jaw.push(r?+r.value:null)}
    else{var t=$("t"+id).value.trim();if(!t)kosong++;else if(!valid(t))aneh++;jaw.push(t)}
  });
  if(!diam){
    if(kosong){$("ps"+mi).textContent="Masih ada "+kosong+" soal yang belum dijawab. Jawab semuanya dulu ya.";return}
    if(aneh){$("ps"+mi).textContent="Ada "+aneh+" jawaban yang penulisannya belum bisa dibaca. Contoh penulisan: 6x − 15 atau −4y + 8.";return}
  }
  var benar=0;
  ms.forEach(function(s,si){var id=mi+"-"+si,ok,ket="",kn="";
    if(s.tipe==="pg"){var pil=jaw[si];ok=pil!==null&&s.opts[pil].ok===1;
      s.opts.forEach(function(o,oi){var l=$("o"+id+"-"+oi);if(l){l.classList.remove("ok","no");if(o.ok)l.classList.add("ok");else if(oi===pil)l.classList.add("no")}});
      document.querySelectorAll('input[name="r'+id+'"]').forEach(function(x){x.disabled=true});kn=s.a}
    else{var c=cekIsi(jaw[si],s.a);ok=c.nilai&&c.sederhana;var e=$("t"+id);e.disabled=true;e.className=ok?"ok":"no";kn=s.a;
      if(c.nilai&&!c.sederhana)ket="Nilainya sudah benar, tetapi bentuknya belum sederhana (masih ada kurung, pembagian, atau suku sejenis yang belum digabung). "}
    if(ok)benar++;
    $("f"+id).innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?pick(PUJI):pick(SEMANGAT))+'</b> <span>'+ket+(ok?"":"Jawaban yang benar: <b class='mat'>"+esc(kn)+"</b>. ")+s.p+'</span></div>';
  });
  var bt=bintangMisi(benar,ms.length);DONE[mi]={benar:benar,bintang:bt};put("m:"+N,DONE);
  var b=$("pm"+mi);if(b)b.style.display="none";
  $("mf"+mi).innerHTML='<div class="banner"><b>Misi '+(mi+1)+' selesai: '+benar+' dari '+ms.length+' benar</b> &nbsp; <span style="font-size:1.3rem">'+bTxt(bt)+'</span>'+(mi<S.length-1?'<p style="margin:10px 0 0"><button class="btn" type="button" onclick="lanjut('+(mi+1)+')">Lanjut ke Misi '+(mi+2)+' &rarr;</button></p>':'')+'</div>';
  if(!diam){jalur();segarkan();if(mi===S.length-1)selesai()}
}
function lanjut(mi){segarkan();jalur();var e=$("ms"+mi);if(e&&e.scrollIntoView)e.scrollIntoView({behavior:"smooth",block:"start"})}
function selesai(){
  if(get("fin:"+N)) return;
  var benar=DONE.reduce(function(s,d){return s+d.benar},0),bintang=DONE.reduce(function(s,d){return s+d.bintang},0),total=S.reduce(function(s,m){return s+m.length},0),nilai=Math.round(benar*100/total);
  var lama=Math.max(1,Math.round((Date.now()-T0)/1000)),waktu=new Date().toLocaleString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  H.push({n:N,waktu:waktu,nilai:nilai,benar:benar,bintang:bintang,maxB:S.length*3,lama:lama});put("h",H);put("fin:"+N,1);
  $("riw").innerHTML=riwayat();
  $("hasil").innerHTML='<div class="banner"><span class="ke">Pengerjaan ke-'+N+'</span><div class="nilai">'+nilai+'</div><div>'+esc(ID.nama)+' (kelas '+esc(ID.kelas)+') &middot; Benar '+benar+' dari '+total+' &middot; Bintang '+bintang+' dari '+(S.length*3)+'</div><div class="hint">'+MISI.map(function(m,i){return "Misi "+(i+1)+": "+DONE[i].benar+"/"+S[i].length}).join(" &middot; ")+'<br>Dikirim: '+esc(waktu)+' &middot; Lama: '+lamaTxt(lama)+'</div><div class="hint" style="margin-top:6px">Foto layar ini dan tunjukkan ke guru. Nomor pengerjaan dan riwayat nilai ikut tercatat.</div><p style="margin:10px 0 0"><button class="btn alt" type="button" onclick="ulangi()">Main lagi (pengerjaan ke-'+(N+1)+', soal baru)</button></p></div>';
  $("hasil").scrollIntoView({behavior:"smooth",block:"start"});
}
function mulaiAttempt(){N=H.length+1;RG=mulberry(hash(kid()+"|"+N));susun();render();window.scrollTo({top:0})}
function ulangi(){mulaiAttempt()}
function rekap(){$("rekap").innerHTML="<b>"+esc(ID.nama)+"</b> (kelas "+esc(ID.kelas)+')<button class="link" id="ganti" type="button">Ganti siswa</button>';$("ganti").onclick=function(){$("app").style.display="none";$("idForm").style.display="block"}}
try{var sv=JSON.parse(localStorage.getItem(SK+"id")||"null");if(sv){$("nama").value=sv.nama||"";$("kelas").value=sv.kelas||""}}catch(e){}
$("mulai").onclick=function(){
  var n=$("nama").value.trim().replace(/\s+/g," "),k=$("kelas").value.trim().replace(",",".");
  if(!n){$("err").textContent="Nama wajib diisi.";return}
  if(!/^\d\.\d{1,2}$/.test(k)){$("err").textContent="Tulis kelas seperti 7.1 (angka, titik, angka).";return}
  $("err").textContent="";ID={nama:n,kelas:k};try{localStorage.setItem(SK+"id",JSON.stringify(ID))}catch(e){}
  H=get("h")||[];$("idForm").style.display="none";$("app").style.display="block";rekap();
  var nxt=H.length+1,adaProgres=get("d:"+nxt)||get("m:"+nxt);
  if(H.length&&!adaProgres){N=nxt;$("top").innerHTML="";$("riw").innerHTML=riwayat();$("misi").innerHTML='<div class="sec"><p style="margin:0 0 10px">Kamu sudah menamatkan latihan ini <b>'+H.length+' kali</b>. Nilai terakhir: <b>'+H[H.length-1].nilai+'</b>.</p><button class="btn" type="button" onclick="mulaiAttempt()">Mulai pengerjaan ke-'+N+'</button></div>';$("hasil").innerHTML=""}
  else mulaiAttempt();
};
</script>
