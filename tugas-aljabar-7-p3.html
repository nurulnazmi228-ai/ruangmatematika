/* ---------- penyimpanan ---------- */
function kid(){return ID.nama.toLowerCase().replace(/\s+/g," ")+"|"+ID.kelas}
function get(k){try{return JSON.parse(localStorage.getItem(SK+k+":"+kid())||"null")}catch(e){return null}}
function put(k,v){try{localStorage.setItem(SK+k+":"+kid(),JSON.stringify(v))}catch(e){}}
function lamaTxt(d){var m=Math.floor(d/60),s=d%60;return (m?m+" menit ":"")+s+" detik"}

/* ---------- tampilan ---------- */
function tabelRiwayat(){
  if(!H.length) return "";
  return '<div class="sec"><div class="lbl">Riwayat pengerjaan</div><table><tr><th>Ke-</th><th>Waktu kirim</th><th>Nilai</th><th>Lama</th></tr>'+H.map(function(h){return '<tr><td>'+h.n+'</td><td>'+esc(h.waktu)+'</td><td><b>'+h.nilai+'</b></td><td>'+lamaTxt(h.lama)+'</td></tr>'}).join("")+'</table></div>';
}
function rekap(){
  $("rekap").innerHTML="<b>"+esc(ID.nama)+"</b> (kelas "+esc(ID.kelas)+")"+'<button class="link" id="ganti" type="button">Ganti siswa</button>';
  $("ganti").onclick=function(){$("app").style.display="none";$("start").style.display="block"};
}
var PENG='<details class="sec ing" open><summary>Pengingat materi</summary><ul>'
 +'<li><b>Suku sejenis</b> punya variabel yang sama. Hanya suku sejenis yang boleh dijumlahkan atau dikurangkan, dan konstanta hanya dengan konstanta.</li>'
 +'<li><b>Penjumlahan:</b> jumlahkan koefisien suku sejenis, variabelnya tetap.<br><span class="mat">(7x − 3y + 4) + (2x + 5y − 9) = 9x + 2y − 5</span></li>'
 +'<li><b>Pengurangan:</b> ubah tanda semua suku di kurung kedua, lalu gabungkan.<br><span class="mat">(8p + 3) − (3p − 2) = 8p + 3 − 3p + 2 = 5p + 5</span></li>'
 +'<li>“Kurangkan <b>B</b> dari <b>A</b>” berarti <span class="mat">A − B</span>.</li>'
 +'<li><b>Soal cerita:</b> baca teliti, tentukan apa arti huruf yang dipakai, hitung banyaknya tiap benda, tulis bentuk aljabarnya, lalu sederhanakan.</li>'
 +'<li>Tulis <b>jawaban akhir</b> di kotak jawaban, misalnya <span class="mat">8a + 6b</span>, <span class="mat">−3x + 5</span>, atau <span class="mat">12.000 + 5t</span>. Urutan suku bebas, huruf besar atau kecil tidak masalah, dan salah ketik sederhana seperti spasi atau titik di akhir tidak mengurangi nilai.</li>'
 +'<li><b>Cara pengerjaan boleh ditulis</b> (tidak wajib). Tulis tiap langkah sebagai bentuk yang nilainya sama, dihubungkan tanda sama dengan atau baris baru, misalnya <span class="mat">(8p + 3) − (3p − 2) = 8p + 3 − 3p + 2 = 5p + 5</span>. Caramu ikut dikoreksi, tetapi <b>nilai ditentukan oleh jawaban akhir</b>: kalau jawaban akhir benar, soal itu benar, dengan atau tanpa cara.</li></ul></details>';
function render(){
  $("riwayat").innerHTML=tabelRiwayat();
  var d=get("d:"+N)||{}, h='<div class="sec"><span class="ke">Pengerjaan ke-'+N+'</span><div class="hint">Setiap pengerjaan memakai soal yang berbeda. Nilai dan nomor pengerjaan akan tampil setelah kamu mengirim.</div></div>'+PENG, no=0;
  [0,1,2].forEach(function(l){
    h+='<div class="sec"><div class="lbl">'+NAMA[l]+' &middot; '+JUMLAH[l]+' soal &middot; bobot '+Math.round(BOBOT[l]*100)+'%</div></div>';
    S.forEach(function(x,i){ if(x.lv!==l) return; no++;
      h+='<div class="sec q"><div class="no">Soal '+no+'</div><p>'+x.s.q+'</p><input type="text" id="j'+i+'" data-i="'+i+'" autocomplete="off" aria-label="Jawaban soal '+no+'" placeholder="Tulis jawaban akhirmu"><details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Tulis caranya (boleh dikosongkan)</summary><textarea id="c'+i+'" data-c="'+i+'" rows="3" aria-label="Cara pengerjaan soal '+no+'" placeholder="Contoh:&#10;(8p + 3) − (3p − 2)&#10;= 8p + 3 − 3p + 2&#10;= 5p + 5"></textarea></details><div id="f'+i+'"></div></div>'; });
  });
  h+='<div class="sec" id="aksi"><button class="btn" id="kirim" type="button">Kirim jawaban</button><div class="pesan" id="pesan"></div></div><div id="hasil"></div>';
  $("tugas").innerHTML=h;
  function kd(e){return e.dataset.i!==undefined?e.dataset.i:"c"+e.dataset.c}
  document.querySelectorAll("[data-i],[data-c]").forEach(function(e){e.value=d[kd(e)]||"";if(e.dataset.c!==undefined&&e.value)e.parentNode.open=true;e.oninput=function(){var o={};document.querySelectorAll("[data-i],[data-c]").forEach(function(x){o[kd(x)]=x.value});put("d:"+N,o)}});
  if(!get("t0:"+N)) put("t0:"+N,Date.now());
  $("kirim").onclick=kirim;
}
function kirim(){
  var kosong=S.filter(function(x,i){return $("j"+i).value.trim()===""}).length, salahTulis=S.filter(function(x,i){var v=$("j"+i).value.trim();return v!==""&&!valid(v)}).length;
  if(salahTulis){$("pesan").textContent="Ada "+salahTulis+" jawaban yang penulisannya belum bisa dibaca (contoh: 8a + 6b atau −3x + 5). Periksa tanda kurung dan hurufnya.";return}
  if(!confirm(kosong?"Masih ada "+kosong+" soal kosong. Tetap kirim? Jawaban akan dikunci.":"Kirim sekarang? Jawaban akan dikunci.")) return;
  var b=[0,0,0], ok=[];
  S.forEach(function(x,i){var v=$("j"+i).value.trim(),o=v!==""&&sama(v,x.s.a);ok.push(o);if(o)b[x.lv]++});
  var nilai=Math.round(100*(BOBOT[0]*b[0]/JUMLAH[0]+BOBOT[1]*b[1]/JUMLAH[1]+BOBOT[2]*b[2]/JUMLAH[2]));
  var lama=Math.max(1,Math.round((Date.now()-(get("t0:"+N)||Date.now()))/1000)), waktu=new Date().toLocaleString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  var rec={n:N,waktu:waktu,nilai:nilai,per:b,lama:lama}; H.push(rec); put("h",H);
  S.forEach(function(x,i){var e=$("j"+i);e.disabled=true;e.className=ok[i]?"ok":"no";$("f"+i).innerHTML='<div class="fb '+(ok[i]?"ok":"no")+'"><b>'+(ok[i]?"Benar.":"Belum tepat.")+'</b> <span>'+(ok[i]?"":"Jawaban yang benar: <b class='mat'>"+x.s.a+"</b>. ")+x.s.p+'</span></div>'+koreksiCara($("c"+i).value,x.s.a);$("c"+i).disabled=true;if($("c"+i).value.trim())$("c"+i).parentNode.open=true});
  $("aksi").style.display="none";
  $("hasil").innerHTML='<div class="banner"><span class="ke">Pengerjaan ke-'+N+'</span><div class="nilai">'+nilai+'</div><div>'+esc(ID.nama)+' (kelas '+esc(ID.kelas)+')</div><div class="hint">'+NAMA.map(function(n,l){return n+": "+b[l]+" dari "+JUMLAH[l]}).join(" &middot; ")+'<br>Dikirim: '+esc(waktu)+' &middot; Lama mengerjakan: '+lamaTxt(lama)+'</div><div class="hint" style="margin-top:6px">Foto layar ini dan tunjukkan ke guru. Nomor pengerjaan dan riwayat nilai ikut tercatat.</div><p style="margin:10px 0 0"><button class="btn alt" type="button" onclick="ulangi()">Kerjakan lagi (pengerjaan ke-'+(N+1)+', soal baru)</button></p></div>';
  $("riwayat").innerHTML=tabelRiwayat(); rekap(); $("hasil").scrollIntoView({behavior:"smooth",block:"start"});
}
function mulaiAttempt(){N=H.length+1; RG=mulberry(hash(kid()+"|"+N)); susun(); render(); window.scrollTo({top:0})}
function ulangi(){mulaiAttempt()}
try{var sv=JSON.parse(localStorage.getItem(SK+"id")||"null");if(sv){$("nama").value=sv.nama||"";$("kelas").value=sv.kelas||""}}catch(e){}
$("mulai").onclick=function(){
  var n=$("nama").value.trim().replace(/\s+/g," "), k=$("kelas").value.trim().replace(",",".");
  if(!n){$("err").textContent="Nama wajib diisi.";return}
  if(!/^\d\.\d{1,2}$/.test(k)){$("err").textContent="Tulis kelas seperti 7.1 (angka, titik, angka).";return}
  $("err").textContent=""; ID={nama:n,kelas:k}; try{localStorage.setItem(SK+"id",JSON.stringify(ID))}catch(e){}
  H=get("h")||[]; $("start").style.display="none"; $("app").style.display="block"; rekap();
  var draf=get("d:"+(H.length+1));
  if(H.length&&!draf){ N=H.length+1; $("riwayat").innerHTML=tabelRiwayat(); $("tugas").innerHTML='<div class="sec"><p style="margin:0 0 10px">Kamu sudah mengerjakan tugas ini sebanyak <b>'+H.length+' kali</b>. Nilai terakhir: <b>'+H[H.length-1].nilai+'</b>.</p><button class="btn" type="button" onclick="mulaiAttempt()">Mulai pengerjaan ke-'+N+'</button></div>'; }
  else mulaiAttempt();
};
</script>
</body>
</html>
