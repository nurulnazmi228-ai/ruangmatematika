/* ================= PERTEMUAN 1: MATERI ================= */
var MATERI1=`
<div class="sec"><div class="lbl">Pertemuan 1</div><h2>Menyelesaikan Persamaan Kuadrat dengan Pemfaktoran</h2><p class="hint" style="margin:8px 0 0"><b>Tujuan:</b> mengenali persamaan kuadrat, memakai tabel faktor untuk menemukan faktornya, dan menentukan akar-akarnya.</p></div>

<div class="sec baca"><div class="lbl">Baca dulu &middot; Kebun Pak Budi</div>
<p>Pak Budi ingin membuat kebun berbentuk persegi panjang dengan luas 28 m². Panjang kebun harus 3 m lebih panjang dari lebarnya. Jika lebarnya <b>x</b> meter, maka panjangnya (x + 3) meter, sehingga luasnya <span class="mat">x(x + 3) = 28</span>.</p>
<p>Kalau dijabarkan dan dipindahkan ke satu ruas, diperoleh <span class="mat">x² + 3x − 28 = 0</span>. Pak Budi tidak mau menebak-nebak ukuran. Apakah ada cara pasti untuk menemukan x? Ada, yaitu <b>pemfaktoran</b>, dan kita akan dibantu sebuah <b>tabel faktor</b>.</p></div>

<div class="sec konsep"><h3>1. Apa itu persamaan kuadrat?</h3>
<ul><li>Bentuk bakunya <span class="mat">ax² + bx + c = 0</span> dengan a ≠ 0. Pangkat tertinggi x adalah 2.</li>
<li>Contoh: <span class="mat">x² + 7x + 12 = 0</span> (a = 1, b = 7, c = 12).</li>
<li><b>Akar-akar</b> adalah nilai x yang membuat persamaan benar. Persamaan kuadrat paling banyak punya dua akar.</li></ul></div>

<div class="sec konsep"><h3>2. Ide dasar pemfaktoran</h3>
<p>Jika dua bilangan dikalikan hasilnya 0, maka <b>salah satunya pasti 0</b>. Jadi kalau <span class="mat">(x + p)(x + q) = 0</span>, maka <span class="mat">x + p = 0</span> atau <span class="mat">x + q = 0</span>, sehingga <span class="mat">x = −p</span> atau <span class="mat">x = −q</span>.</p>
<p>Perhatikan hasil penjabarannya: <span class="mat">(x + p)(x + q) = x² + (p + q)x + p·q</span>. Bandingkan dengan <span class="mat">x² + bx + c</span>. Artinya:</p>
<ul><li><b>p × q = c</b> (p dan q adalah pasangan faktor dari c)</li><li><b>p + q = b</b></li></ul>
<p style="margin-top:8px">Tugas kita: <b>cari dua bilangan p dan q</b> yang hasil kalinya c dan jumlahnya b. Tabel faktor membantu mencarinya dengan rapi.</p></div>

<div class="sec"><h3>3. Langkah dengan tabel faktor (untuk a = 1)</h3>
<ol><li>Ubah ke bentuk baku <span class="mat">x² + bx + c = 0</span>. Catat nilai b dan c.</li>
<li>Buat tabel. Tulis <b>semua pasangan faktor dari c</b> (p dan q), termasuk yang negatif.</li>
<li>Isi kolom <b>p + q</b> untuk setiap baris.</li>
<li>Pilih baris yang <b>p + q = b</b>. Itulah p dan q yang kita cari.</li>
<li>Tulis <span class="mat">(x + p)(x + q) = 0</span>, lalu akarnya <span class="mat">x = −p</span> dan <span class="mat">x = −q</span>.</li></ol></div>

<div class="sec"><h3>Contoh 1: <span class="mat">x² + 7x + 12 = 0</span></h3>
<p>Di sini b = 7 dan c = 12. Pasangan faktor dari 12:</p>
<div class="scroll"><table class="tb"><tr><th>p</th><th>q</th><th>p × q</th><th>p + q</th></tr><tr><td>−12</td><td>−1</td><td>12</td><td>−13</td></tr><tr><td>−6</td><td>−2</td><td>12</td><td>−8</td></tr><tr><td>−4</td><td>−3</td><td>12</td><td>−7</td></tr><tr><td>1</td><td>12</td><td>12</td><td>13</td></tr><tr><td>2</td><td>6</td><td>12</td><td>8</td></tr><tr class="hit"><td>3</td><td>4</td><td>12</td><td>7</td></tr></table></div>
<p>Baris yang jumlahnya 7 adalah p = 3 dan q = 4. Jadi <span class="mat">(x + 3)(x + 4) = 0</span>, maka <span class="mat">x = −3</span> atau <span class="mat">x = −4</span>.</p></div>

<div class="sec"><h3>Contoh 2: <span class="mat">x² − 2x − 15 = 0</span></h3>
<p>Di sini b = −2 dan c = −15. Pasangan faktor dari −15:</p>
<div class="scroll"><table class="tb"><tr><th>p</th><th>q</th><th>p × q</th><th>p + q</th></tr><tr><td>−15</td><td>1</td><td>−15</td><td>−14</td></tr><tr class="hit"><td>−5</td><td>3</td><td>−15</td><td>−2</td></tr><tr><td>−3</td><td>5</td><td>−15</td><td>2</td></tr><tr><td>−1</td><td>15</td><td>−15</td><td>14</td></tr></table></div>
<p>Baris yang jumlahnya −2 adalah p = −5 dan q = 3. Jadi <span class="mat">(x − 5)(x + 3) = 0</span>, maka <span class="mat">x = 5</span> atau <span class="mat">x = −3</span>.</p>
<p class="hint">Petunjuk tanda: jika c positif, p dan q bertanda sama (sama dengan tanda b). Jika c negatif, p dan q bertanda berbeda.</p></div>

<div class="sec"><h3>4. Jika a ≠ 1</h3>
<p>Pakai <b>n = a × c</b> sebagai pengganti c pada tabel. Cari p dan q yang p × q = a × c dan p + q = b, lalu pecah suku tengah.</p>
<p><b>Contoh:</b> <span class="mat">2x² + 7x + 3 = 0</span>. a × c = 6. Dari tabel faktor 6, pasangan yang berjumlah 7 adalah 1 dan 6.</p>
<p class="mat" style="margin:0">2x² + 1x + 6x + 3 = 0<br>x(2x + 1) + 3(2x + 1) = 0<br>(2x + 1)(x + 3) = 0</p>
<p style="margin-top:6px">Maka <span class="mat">x = −1/2</span> atau <span class="mat">x = −3</span>.</p></div>

<div class="sec"><h3>Coba sendiri: pencari faktor</h3>
<p class="hint">Masukkan a, b, dan c dari persamaan <span class="mat">ax² + bx + c = 0</span>, lalu lihat tabelnya.</p>
<div class="row3"><div><label class="f" for="wa">a</label><input type="number" id="wa" value="1"></div><div><label class="f" for="wb">b</label><input type="number" id="wb" value="7"></div><div><label class="f" for="wc">c</label><input type="number" id="wc" value="12"></div></div>
<p style="margin-top:10px"><button class="btn" type="button" onclick="cari()">Buat tabel</button></p><div id="hasilCari"></div></div>

<div class="sec konsep"><h3>Kesalahan yang sering terjadi</h3>
<ul><li>Lupa mengubah ke bentuk baku. <span class="mat">x² + 8x = −15</span> harus dijadikan <span class="mat">x² + 8x + 15 = 0</span> dulu.</li>
<li>Menulis akar sama dengan p, padahal akarnya <b>−p</b>. Dari <span class="mat">(x + 3)</span> akarnya −3.</li>
<li>Tidak memeriksa tanda. Cek: p × q harus tepat sama dengan c, dan p + q tepat sama dengan b.</li>
<li>Pada soal cerita, akar negatif untuk ukuran (panjang, lebar) tidak dipakai.</li></ul></div>

<div class="sec"><h3>Kembali ke kebun Pak Budi</h3>
<p><span class="mat">x² + 3x − 28 = 0</span>: b = 3, c = −28. Pasangan faktor −28 yang berjumlah 3 adalah p = 7 dan q = −4. Jadi <span class="mat">(x + 7)(x − 4) = 0</span>, maka x = −7 atau x = 4. Lebar tidak mungkin negatif, jadi <b>lebar kebun 4 m dan panjangnya 7 m</b>. Cek: 4 × 7 = 28.</p></div>
`;
function cari(){
  var a=+$("wa").value,b=+$("wb").value,c=+$("wc").value,o=$("hasilCari");
  if(!a||!Number.isInteger(a)||!Number.isInteger(b)||!Number.isInteger(c)||c===0){o.innerHTML='<p class="pesan">Isi a, b, c dengan bilangan bulat, a dan c tidak boleh 0.</p>';return}
  var n=a*c,hit=pasangan(n).filter(function(r){return r[0]+r[1]===b})[0];
  var h='<p><b class="mat">'+pers(a,b,c)+'</b>, dengan '+(a===1?'c = '+m(c):'a × c = '+m(n))+' dan b = '+m(b)+':</p>'+tabel(n,b,true);
  if(!hit){h+='<p class="pesan">Tidak ada pasangan bilangan bulat dengan p × q = '+m(n)+' dan p + q = '+m(b)+'. Persamaan ini tidak bisa difaktorkan dengan cara ini.</p>'}
  else{var p=hit[0],q=hit[1];
    if(a===1)h+='<p>Pasangan yang tepat: p = '+m(p)+' dan q = '+m(q)+'. Jadi <span class="mat">'+fk(p)+fk(q)+' = 0</span>, maka <b>x = '+m(-p)+' atau x = '+m(-q)+'</b>.</p>';
    else{var D=b*b-4*a*c,r=Math.sqrt(D);h+='<p>Pasangan yang tepat: '+m(p)+' dan '+m(q)+'. Akar-akarnya: <b>x = '+frac(-b+r,2*a)+' atau x = '+frac(-b-r,2*a)+'</b>.</p>'}}
  o.innerHTML=h;
}

var SK="pkuadrat8-p1:",ID=null,N=1,H=[],RG=null,S=[];
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function susun(){

  S.push(soalAa());S.push(soalAa());
  S.push(soalCerita());
}
function angka(s){
  s=String(s).toLowerCase().replace(/[−–—‑]/g,"-").replace(/\s/g,"").replace(/^x[12]?=/,"").replace(/[.;]+$/,"").replace(/(meter|cm|m)$/,"").replace(/^\((.*)\)$/,"$1").replace(",",".");
  var r=/^([+-]?)(\d+(?:\.\d+)?)(?:\/(\d+(?:\.\d+)?))?$/.exec(s); if(!r) return null;
  var v=parseFloat(r[2]); if(r[3]){var d=parseFloat(r[3]); if(!d) return null; v/=d} return r[1]==="-"?-v:v;
}
function samaList(a,b){a=a.slice().sort(function(x,y){return x-y});b=b.slice().sort(function(x,y){return x-y});return a.length===b.length&&a.every(function(x,i){return Math.abs(x-b[i])<1e-9})}
function kid(){return ID.nama.toLowerCase().replace(/\s+/g," ")+"|"+ID.kelas}
function get(k){try{return JSON.parse(localStorage.getItem(SK+k+":"+kid())||"null")}catch(e){return null}}
function put(k,v){try{localStorage.setItem(SK+k+":"+kid(),JSON.stringify(v))}catch(e){}}
function lamaTxt(d){var mm=Math.floor(d/60),s=d%60;return (mm?mm+" menit ":"")+s+" detik"}
function riwayat(){
  if(!H.length) return "";
  return '<div class="sec"><div class="lbl">Riwayat pengerjaan</div><div class="scroll"><table class="tb" style="font-family:inherit;width:100%"><tr><th>Ke-</th><th>Waktu kirim</th><th>Nilai</th><th>Lama</th></tr>'+H.map(function(h){return '<tr><td>'+h.n+'</td><td>'+esc(h.waktu)+'</td><td><b>'+h.nilai+'</b></td><td>'+lamaTxt(h.lama)+'</td></tr>'}).join("")+'</table></div></div>';
}
function mulaiTugas(){
  var n=$("tnama").value.trim().replace(/\s+/g," "),k=$("tkelas").value.trim().replace(",",".");
  if(!n){$("terr").textContent="Nama wajib diisi.";return}
  if(!/^\d\.\d{1,2}$/.test(k)){$("terr").textContent="Tulis kelas seperti 8.1 (angka, titik, angka).";return}
  $("terr").textContent="";ID={nama:n,kelas:k};try{localStorage.setItem(SK+"id",JSON.stringify(ID))}catch(e){}
  H=get("h")||[];$("idForm").style.display="none";$("tugasApp").style.display="block";
  $("rekapT").innerHTML="<b>"+esc(n)+"</b> (kelas "+esc(k)+')<button class="link" id="gantiT" type="button">Ganti siswa</button>';
  $("gantiT").onclick=function(){$("tugasApp").style.display="none";$("idForm").style.display="block"};
  var draf=get("d:"+(H.length+1));
  if(H.length&&!draf){N=H.length+1;$("riwT").innerHTML=riwayat();$("soalT").innerHTML='<div class="sec"><p style="margin:0 0 10px">Kamu sudah mengerjakan tugas ini <b>'+H.length+' kali</b>. Nilai terakhir: <b>'+H[H.length-1].nilai+'</b>.</p><button class="btn" type="button" onclick="mulaiAttempt()">Mulai pengerjaan ke-'+N+'</button></div>'}
  else mulaiAttempt();
}
function mulaiAttempt(){N=H.length+1;RG=mulberry(hash(kid()+"|"+N));susun();renderSoal()}
function renderSoal(){
  $("riwT").innerHTML=riwayat();var d=get("d:"+N)||{};
  var h='<div class="sec"><span class="ke">Pengerjaan ke-'+N+'</span><div class="hint">Setiap pengerjaan memakai soal dengan angka berbeda. Tiap soal bernilai 10. Yang dinilai adalah akar-akarnya; kotak faktor hanya untuk membantu dan ikut dikoreksi.</div></div>';
  S.forEach(function(x,i){
    var cer=x.tipe==="cerita";
    h+='<div class="sec q"><div class="lbl">Soal '+(i+1)+'</div><p>'+x.q+'</p><details'+(i<2?' open':'')+'><summary>Tabel faktor untuk '+(cer?'c':(x.eq[0]===1?'c':'a × c'))+' = '+(cer?'−'+(-x.n)+' (setelah kamu membentuk persamaannya)':m(x.n))+'</summary><p class="hint" style="margin:6px 0 0">'+(cer?'Cari pasangan p dan q dengan p × q = c dan p + q = b.':'Cari baris yang p + q = '+m(x.b)+'.')+'</p>'+tabel(x.n,x.b,false)+'</details>'
     +'<div class="ans"><span>Faktor: p =</span><input class="s" type="text" data-k="p'+i+'" id="p'+i+'" autocomplete="off" aria-label="p soal '+(i+1)+'"><span>q =</span><input class="s" type="text" data-k="q'+i+'" id="q'+i+'" autocomplete="off" aria-label="q soal '+(i+1)+'"></div>'
     +'<div class="ans">'+(cer?'<span>Lebar kebun x =</span><input class="s" type="text" data-k="a'+i+'" id="a'+i+'" autocomplete="off" aria-label="x soal '+(i+1)+'"><span>meter</span>':'<span>x₁ =</span><input class="s" type="text" data-k="a'+i+'" id="a'+i+'" autocomplete="off" aria-label="x1 soal '+(i+1)+'"><span>x₂ =</span><input class="s" type="text" data-k="b'+i+'" id="b'+i+'" autocomplete="off" aria-label="x2 soal '+(i+1)+'">')+'</div><div id="f'+i+'"></div></div>';
  });
  h+='<div class="sec" id="aksiT"><button class="btn" id="kirimT" type="button" onclick="kirim()">Kirim jawaban</button><div class="pesan" id="pesanT"></div></div><div id="hasilT"></div>';
  $("soalT").innerHTML=h;
  document.querySelectorAll("[data-k]").forEach(function(e){e.value=d[e.dataset.k]||"";e.oninput=function(){var o={};document.querySelectorAll("[data-k]").forEach(function(x){o[x.dataset.k]=x.value});put("d:"+N,o)}});
  if(!get("t0:"+N))put("t0:"+N,Date.now());
}
function kirim(){
  var kosong=0,aneh=0;
  S.forEach(function(x,i){["a"+i].concat(x.tipe==="cerita"?[]:["b"+i]).forEach(function(k){var v=$(k).value.trim();if(v==="")kosong++;else if(angka(v)===null)aneh++})});
  if(aneh){$("pesanT").textContent="Ada "+aneh+" jawaban akar yang penulisannya belum bisa dibaca. Tulis bilangan seperti −3, 4, atau −1/2.";return}
  if(!confirm(kosong?"Masih ada "+kosong+" kotak akar yang kosong. Tetap kirim? Jawaban akan dikunci.":"Kirim sekarang? Jawaban akan dikunci."))return;
  var benar=0;
  S.forEach(function(x,i){
    var ok,ket="";
    if(x.tipe==="cerita"){var v=angka($("a"+i).value);ok=v!==null&&Math.abs(v-x.akar[0])<1e-9}
    else{var v1=angka($("a"+i).value),v2=angka($("b"+i).value);ok=v1!==null&&v2!==null&&samaList([v1,v2],x.akar)}
    var pv=angka($("p"+i).value),qv=angka($("q"+i).value),adaF=$("p"+i).value.trim()!==""||$("q"+i).value.trim()!=="";
    var fok=pv!==null&&qv!==null&&samaList([pv,qv],x.pq);
    if(ok)benar++;
    ["p","q","a","b"].forEach(function(c){var e=$(c+i);if(e){e.disabled=true;e.className="s "+((c==="p"||c==="q")?(adaF?(fok?"ok":"no"):""):(ok?"ok":"no"))}});
    var kuncit=x.tipe==="cerita"?"x = "+m(x.akar[0])+" meter":"x = "+fmtAkar(x.akar[0])+" atau x = "+fmtAkar(x.akar[1]);
    $("f"+i).innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Benar.":"Belum tepat.")+'</b> <span>'+(ok?"":"Jawaban yang benar: <b class='mat'>"+kuncit+"</b>. ")+x.p+'</span></div>'
      +(adaF?'<div class="fb '+(fok?"ok":"no")+'" style="margin-top:6px"><b>Faktormu '+(fok?"benar":"belum tepat")+'.</b> <span>p dan q yang tepat: '+m(x.pq[0])+' dan '+m(x.pq[1])+' (p × q = '+m(x.n)+', p + q = '+m(x.b)+').</span></div>':'');
    sorot(i);
  });
  var nilai=benar*10,lama=Math.max(1,Math.round((Date.now()-(get("t0:"+N)||Date.now()))/1000)),waktu=new Date().toLocaleString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  H.push({n:N,waktu:waktu,nilai:nilai,benar:benar,lama:lama});put("h",H);
  $("aksiT").style.display="none";
  $("hasilT").innerHTML='<div class="banner"><span class="ke">Pengerjaan ke-'+N+'</span><div class="nilai">'+nilai+'</div><div>'+esc(ID.nama)+' (kelas '+esc(ID.kelas)+') &middot; Benar '+benar+' dari 10</div><div class="hint">Dikirim: '+esc(waktu)+' &middot; Lama: '+lamaTxt(lama)+'</div><div class="hint" style="margin-top:6px">Foto layar ini dan tunjukkan ke guru. Nomor pengerjaan dan riwayat nilai ikut tercatat.</div><p style="margin:10px 0 0"><button class="btn alt" type="button" onclick="mulaiAttempt()">Kerjakan lagi (pengerjaan ke-'+(N+1)+', soal baru)</button></p></div>';
  $("riwT").innerHTML=riwayat();$("hasilT").scrollIntoView({behavior:"smooth",block:"start"});
}
function fmtAkar(v){for(var d=1;d<=9;d++){var n=v*d;if(Math.abs(n-Math.round(n))<1e-9)return frac(Math.round(n),d)}return String(v)}
function sorot(i){var x=S[i],det=$("f"+i).parentNode.querySelector("details");if(!det)return;det.open=true;det.querySelector("div.scroll").outerHTML=tabel(x.n,x.b,true)}

function bukaTugas(){
  var h='<div class="sec"><div class="lbl">Tugas Pertemuan 1</div><h2>10 soal pemfaktoran</h2><p class="hint" style="margin:6px 0 0">Kerjakan dengan tabel faktor. Soal 1-6 bentuk x² + bx + c, soal 7 perlu diubah ke bentuk baku, soal 8-9 punya a ≠ 1, dan soal 10 soal cerita.</p></div>'
   +'<div class="sec" id="idForm"><h3>Isi identitas dulu</h3><label class="f" for="tnama">Nama</label><input type="text" id="tnama" autocomplete="off"><label class="f" for="tkelas">Kelas</label><input type="text" id="tkelas" placeholder="Contoh: 8.1" autocomplete="off"><div class="pesan" id="terr"></div><p style="margin-bottom:0"><button class="btn" type="button" onclick="mulaiTugas()">Mulai mengerjakan</button></p></div>'
   +'<div id="tugasApp" style="display:none"><p class="rekap" id="rekapT"></p><div id="riwT"></div><div id="soalT"></div></div>';
  return h;
}

/* ================= WADAH PERTEMUAN 2 DAN 3 ================= */
function wadah(no,judul,isi){
  return '<div class="sec"><div class="lbl">Pertemuan '+no+'</div><h2>'+judul+'</h2></div><div class="sec wadah"><h3>Segera hadir</h3><p class="hint">Materi dan tugas pertemuan ini sedang disiapkan oleh guru. Isinya nanti:</p><ul>'+isi.map(function(t){return '<li>'+t+'</li>'}).join("")+'</ul></div>';
}
var TAB=[
 {t:"Pertemuan 1 · Pemfaktoran",c:function(){return MATERI1+bukaTugas()}},
 {t:"Pertemuan 2 · Kuadrat sempurna",c:function(){return wadah(2,"Menyelesaikan Persamaan Kuadrat dengan Kuadrat Sempurna",["Materi dan contoh langkah melengkapkan kuadrat","Alat bantu visual","10 soal dengan koreksi otomatis"])}},
 {t:"Pertemuan 3 · Rumus abc",c:function(){return wadah(3,"Menyelesaikan Persamaan Kuadrat dengan Rumus abc",["Materi, rumus, dan diskriminan","Contoh langkah demi langkah","10 soal dengan koreksi otomatis"])}}
];
var cur=0;
function tabs(){$("tabs").innerHTML=TAB.map(function(x,i){return '<button class="tab" role="tab" aria-selected="'+(i===cur)+'" onclick="buka('+i+')">'+x.t+(i>0?" (segera)":"")+'</button>'}).join("")}
function buka(i){cur=i;tabs();$("isi").innerHTML=TAB[i].c();history.replaceState(null,"","#p"+(i+1));window.scrollTo({top:0});
  if(i===0){try{var sv=JSON.parse(localStorage.getItem(SK+"id")||"null");if(sv){$("tnama").value=sv.nama||"";$("tkelas").value=sv.kelas||""}}catch(e){}cari()}}
var mm=/^#p([1-3])$/.exec(location.hash);buka(mm?+mm[1]-1:0);
</script>
